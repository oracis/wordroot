<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 320px; font-family: sans-serif; padding: 12px; color: #2b2b2b; }
      h3 { margin: 0 0 8px; font-size: 14px; }
      input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
      #out { margin-top: 10px; font-size: 13px; line-height: 1.6; }
      .word { font-size: 18px; font-weight: 700; }
      .phon { color: #b06a2c; font-size: 13px; margin: 2px 0 6px; }
      .sec { margin-top: 8px; }
      .sec h4 { margin: 0 0 2px; font-size: 12px; color: #8a6d3b; }
      .need { color: #b06a2c; }
      ul { margin: 4px 0; padding-left: 18px; }
    </style>
  </head>
  <body>
    <h3>词源划词 · 快捷查词</h3>
    <input id="q" placeholder="输入英文单词，回车查询" autofocus />
    <div id="out"></div>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
      <button id="openVocab" style="flex:1;padding:8px;border:1px solid #d8cdb8;background:#fff;border-radius:8px;cursor:pointer;font-size:13px">📚 生词本 <span id="vocabCnt" style="color:#b06a2c"></span></button>
      <button id="openReader" style="flex:1;padding:8px;border:1px solid #d8cdb8;background:#fff;border-radius:8px;cursor:pointer;font-size:13px">📄 打开本地 PDF</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
